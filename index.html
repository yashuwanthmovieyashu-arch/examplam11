<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        .container {
            background: white;
            width: 400px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        li {
            list-style: none;
            padding: 10px;
            background: #eee;
            margin: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>My To-Do List</h1>
        <h2> new repo in this wen site</h2>

        <input type="text" id="task" placeholder="Enter your task">

        <button onclick="addTask()">Add</button>

        <ul id="taskList"></ul>
    </div>

    <script>

        function addTask() {

            let task = document.getElementById("task").value;

            if (task === "") {
                alert("Please enter a task");
                return;
            }

            let li = document.createElement("li");

            li.innerHTML = task +
            ' <button onclick="this.parentElement.remove()">Delete</button>';

            document.getElementById("taskList").appendChild(li);

            document.getElementById("task").value = "";
        }

    </script>

</body>
</html>
