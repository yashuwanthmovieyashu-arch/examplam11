<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="hf.css">

    <title>Dynamic To-Do List</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 450px;
            max-width: 90%;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
        }

        .input-section {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.85;
        }

        .task-info {
            margin-top: 20px;
            color: #666;
        }

        ul {
            padding: 0;
        }

        li {
            list-style: none;
            background: #f4f4f4;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            text-align: left;
        }

        .task-text {
            cursor: pointer;
            flex: 1;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .delete-btn {
            background: #e74c3c;
            margin-left: 10px;
        }

        .clear-btn {
            background: #333;
            margin-top: 15px;
        }

        @media (max-width: 500px) {

            .container {
                padding: 20px;
            }

            .input-section {
                flex-direction: column;
            }

        }

    </style>
</head>

<body>

    <div class="container">

        <h1>📝 My To-Do List</h1>

        <div class="input-section">

            <input
                type="text"
                id="task"
                placeholder="Enter your task..."
            >

            <button onclick="addTask()">Add</button>

        </div>

        <div class="task-info">
            Total Tasks: <span id="taskCount">0</span>
        </div>

        <ul id="taskList"></ul>

        <button class="clear-btn" onclick="clearTasks()">
            Clear All
        </button>

    </div>


    <script>

        // Add Task
        function addTask() {

            let taskInput = document.getElementById("task");

            let task = taskInput.value.trim();

            if (task === "") {

                alert("Please enter a task!");

                return;
            }

            let li = document.createElement("li");


            // Task text
            let taskText = document.createElement("span");

            taskText.textContent = task;

            taskText.className = "task-text";


            // Mark task as completed
            taskText.onclick = function () {

                taskText.classList.toggle("completed");

            };


            // Delete button
            let deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";

            deleteButton.className = "delete-btn";


            deleteButton.onclick = function () {

                li.remove();

                updateTaskCount();

            };


            li.appendChild(taskText);

            li.appendChild(deleteButton);


            document
                .getElementById("taskList")
                .appendChild(li);


            taskInput.value = "";

            updateTaskCount();

        }


        // Update task count
        function updateTaskCount() {

            let tasks =
                document.querySelectorAll("#taskList li");

            document
                .getElementById("taskCount")
                .textContent = tasks.length;

        }


        // Clear all tasks
        function clearTasks() {

            let taskList =
                document.getElementById("taskList");


            if (taskList.children.length === 0) {

                alert("No tasks available!");

                return;

            }


            taskList.innerHTML = "";

            updateTaskCount();

        }


        // Press Enter to add task
        document
            .getElementById("task")
            .addEventListener("keypress", function (event) {

                if (event.key === "Enter") {

                    addTask();

                }

            });

    </script>

</body>

</html>
